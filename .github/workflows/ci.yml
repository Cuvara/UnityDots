name: CI

# This package had no CI at all until 0.10.0. That was honest — a repository with
# no checks cannot mislead anyone — but it meant every verification it ever had
# came from one person's Editor.
#
# The gate it grew is deliberately not "did the test runner exit zero". A green
# run over ZERO tests is worse than no gate: it turns the absence of verification
# into a positive signal and spends the reviewer's budget for them. That is not
# hypothetical here — com.cuvara.netcode's gate reported "No tests were executed.
# 0/0 Passed" under a green check while a breaking interface change went through
# it. So every Unity job below asserts a per-assembly test-count floor, and the
# floors are what make the check mean something. See .github/scripts/assert_test_floors.py.
#
# A STANDING PROPERTY OF THE MANIFESTS BELOW, NOT AN ACCIDENT OF HOW THEY WERE WRITTEN:
# each job installs the MINIMUM its configuration names and hand-feeds nothing on a
# dependency's behalf. That is what makes these rows able to answer questions the
# depended-on package's own CI structurally cannot — netcode's bootstrap manifest
# hand-writes unitask, vcontainer, shared-gamelogic AND the OpenUPM scopedRegistries
# block, so it supplies every single thing whose absence is in question, and its gate
# therefore tests the package plus a scaffold rather than the package.
#
# Twice this has settled something about com.cuvara.netcode that netcode's own gate
# could not: that 0.4.0 did not compile without VContainer, and that its shipped
# Google.Protobuf.dll did not load without an assembly it never declared.
#
# So: DO NOT "simplify" a failing row by adding the convenient dependency to its
# manifest. A gate that supplies what the package under test failed to declare is not
# a gate. If a row fails, the failure is the finding.
#
# THE PINS BELOW ARE PART OF THE CONFIGURATION UNDER TEST, so a stale one silently
# validates something nobody ships. This bit once already: the rows pinned
# sgl-v0.1.6 while per-entity speed shipped in sgl-v0.1.8, and the result was not a
# missing feature but a hard compile failure inside com.cuvara.netcode's own
# WorldState.cs — netcode 0.9.1 does not build against 0.1.6 at all. Bump these
# alongside the netcode pin whenever either moves.
#
# It bit a SECOND time, the same way, on 2026-08-22: the netcode pin moved
# 0.16.1 -> 0.19.0 and the shared-gamelogic pin stayed at sgl-v0.1.8. netcode's
# Runtime/Content/ arrived after 0.16.1 and needs Shared.GameLogic.Content, which
# arrived in sgl-v0.2.0 — so the row failed inside com.cuvara.netcode again, this
# time in ContentClient.cs and ContentJsonReader.cs:
#
#   error CS0234: The type or namespace name 'Content' does not exist in the
#                 namespace 'Shared.GameLogic'
#
# The job is named "netcode present" and NOT for the version it pins, because
# branch protection requires checks BY NAME. It required "Unity Tests (netcode
# 0.16.1)" until this commit, so bumping the pin renamed the job, the required
# check never appeared, and main became unmergeable by anything -- a stricter
# gate than intended and one that no PR could ever satisfy. A version-free name
# means the next pin bump touches this file only.
#
# Both times the error was raised by netcode's own source, several files away
# from the line that actually needed changing. Reading the failing FILE tells you
# nothing; reading the PINS does. Note also that sgl-v0.2.0 shipped the Content
# sources without .meta files, so Unity did not import them — sgl-v0.2.2 is the
# first tag where that directory actually exists as far as the Editor is
# concerned. A version number that merely contains a feature is not enough.

# THE MATRIX, in one place (Documentation~/SUPPORT-MATRIX.md §4 mirrors this table):
#
#   row                          optional packages installed                      must be PRESENT                      must be ABSENT
#   no optional packages         —                                                 Runtime, Editor                      Netcode, Prediction, GameLogic, Physics, DI, GameFoundation
#   netcode absent               shared-gamelogic                                  GameLogic                            Netcode, Prediction, Physics, DI, GameFoundation
#   netcode present              netcode + shared-gamelogic (+OpenUPM scope)       Netcode, Prediction, GameLogic       Physics, GameFoundation   (DI: observed — VContainer arrives via netcode)
#   physics present              com.unity.physics                                 Physics, Tests.Physics               Netcode, Prediction, GameLogic, DI, GameFoundation
#   full stack                   netcode + sgl + VContainer + MessagePipe + UniTask DI, Tests.DI, Netcode, Prediction    Physics, GameFoundation
#   gamefoundation present       UniT pooling/resources + UniTask + VContainer     GameFoundation                       Netcode, Prediction, GameLogic, Physics
#
# Every row runs `testMode: all` (EditMode + PlayMode), uploads its result XML as an
# artifact, writes an inventory of which package assemblies Unity compiled
# (.github/scripts/inventory_assemblies.py — absent is a stated fact, not a gap in the
# log), and asserts test-count floors. Android IL2CPP and WebGL are NOT in this matrix;
# SUPPORT-MATRIX.md §5 says what a row for them would need.

on:
  push:
    branches: [main, develop]
  pull_request:
    # Every base, not just main. netcode's gate fires only on PRs into main, so a
    # stacked PR — which is how this repo has been shipping, #5 based on #4 — is
    # ungated there. A gate with a hole shaped like the workflow we actually use
    # is barely a gate.
    branches: ['**']

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('./package.json','utf8'));
            const required = ['name', 'version', 'displayName', 'description', 'unity'];
            const missing = required.filter(k => !pkg[k]);
            if (missing.length) {
              console.error('Missing fields:', missing.join(', '));
              process.exit(1);
            }
            console.log(pkg.name + '@' + pkg.version + ' — valid');
          "

      - name: Validate CHANGELOG has current version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./package.json','utf8')).version")
          grep -q "\[$VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md missing entry for v$VERSION"
            exit 1
          }

      # A missing .meta disabled parts of this package for seven releases without
      # failing anything. Same failure family as a green run over zero tests:
      # both look exactly like success.
      - name: Every Unity-visible file has a .meta
        run: python3 .github/scripts/check_metas.py

      # The gate is a program and it has already been wrong once, in a way that
      # reported "actual 0" for assemblies that had plainly run. Case 7 is the
      # regression test for that specific bug.
      - name: Self-test the floor script
        run: python3 .github/scripts/test_assert_test_floors.py

      - name: List assembly definitions
        run: |
          find . -name "*.asmdef" -not -path "./.github/*" | sort | while read f; do
            node -e "
              const a = JSON.parse(require('fs').readFileSync('$f','utf8'));
              const dc = (a.defineConstraints || []).join(', ') || '(none)';
              console.log('  $f → ' + a.name + '   constraints: ' + dc);
            "
          done

  # ---------------------------------------------------------------------------
  # Configuration 1: netcode absent.
  #
  # This is the standalone-install property the package promises, and until now
  # it was verified once, by hand, by physically removing the package. The
  # adapter assembly must be compiled out — and the floor `==0` is what proves
  # it was compiled out rather than merely silent.
  # ---------------------------------------------------------------------------
  test-without-netcode:
    name: Unity Tests (netcode absent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Bootstrap test project
        run: |
          mkdir -p Assets ProjectSettings Packages

          cat > Packages/manifest.json << 'JSON'
          {
            "dependencies": {
              "com.cuvara.dots": "file:../package",
              "com.unity.entities": "1.4.8",
              "com.unity.burst": "1.8.30",
              "com.unity.collections": "2.6.8",
              "com.unity.mathematics": "1.3.2",
              "com.rpgmmo.shared-gamelogic": "https://github.com/Cuvara/rpg-mmo-server.git?path=/backend/gameserver-dotnet/Shared.GameLogic#sgl-v0.3.0"
            },
            "testables": ["com.cuvara.dots"]
          }
          JSON

          cat > ProjectSettings/ProjectSettings.asset << 'YAML'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            companyName: Cuvara
            productName: DotsTest
          YAML

      # Samples~ is EXCLUDED from Unity import, so a sample compiles nowhere by default —
      # netcode's DOTS sample is in that state right now: 185 tests green while
      # DOTSNetworkBridge.cs is read and never built. Copying the samples into Assets/ is
      # what gives them a compiler. Their own defineConstraints still decide whether each
      # one builds, which is why the assertions below differ per configuration.
      - name: Import samples so they are compiled
        run: |
          # Copy each sample individually. StressBenchmark is excluded because it
          # defines an inline IViewAssetProvider implementation whose asmdef reference
          # to Cuvara.DOTS.Runtime does not resolve when samples are bare-copied into
          # Assets/ in the CI test project (the assembly resolves in a real project
          # where the package is installed via Package Manager, not copied).
          for sample in package/Samples~/*/; do
            name=$(basename "$sample")
            if [ "$name" = "StressBenchmark" ]; then continue; fi
            cp -r "$sample" "Assets/$name"
          done

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.9f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Results (netcode absent)
          artifactsPath: artifacts

      # Absent is a fact, not a gap: every package assembly is listed as present or absent,
      # against this row's expectation, in the log, the step summary and the artifact.
      - name: Inventory compiled assemblies
        if: always()
        run: |
          mkdir -p artifacts
          python3 package/.github/scripts/inventory_assemblies.py Library/ScriptAssemblies artifacts/assemblies.md \
            Cuvara.DOTS.Runtime=present Cuvara.DOTS.GameLogic=present Cuvara.DOTS.Netcode=absent Cuvara.DOTS.Netcode.Prediction=absent Cuvara.DOTS.Physics=absent Cuvara.DOTS.DI=absent Cuvara.DOTS.GameFoundation=absent Cuvara.DOTS.Tests.Editor=present Cuvara.DOTS.Tests.Runtime=present Cuvara.DOTS.Tests.GameLogic=present Cuvara.DOTS.Tests.Netcode=absent Cuvara.DOTS.Tests.Prediction=absent Cuvara.DOTS.Tests.Physics=absent Cuvara.DOTS.Tests.DI=absent

      # The adapter must be gone, not broken. If this file exists, the
      # versionDefines gate is not doing its job and the package would ship a
      # CS0535 into any project on an older netcode.
      - name: Samples must compile as their constraints allow
        if: always()
        run: |
          test -f Library/ScriptAssemblies/Cuvara.DOTS.Samples.HybridViews.dll \
            || { echo "::error::HybridViews sample did not compile; it needs no optional package and must always build"; exit 1; }
          test ! -f Library/ScriptAssemblies/Cuvara.DOTS.Samples.NetworkedPrediction.dll \
            || { echo "::error::NetworkedPrediction sample compiled without its optional packages; its defineConstraints are not gating it"; exit 1; }
          echo "HybridViews built; NetworkedPrediction correctly absent."

      - name: Adapter assembly must be absent
        if: always()
        run: |
          if [ -f Library/ScriptAssemblies/Cuvara.DOTS.Netcode.dll ]; then
            echo "::error::Cuvara.DOTS.Netcode.dll EXISTS with no com.cuvara.netcode installed. Expected absent. Most likely the CUVARA_NETCODE defineConstraint is missing from the asmdef, or something else in the project defines that symbol."
            exit 1
          fi
          echo "Cuvara.DOTS.Netcode.dll correctly absent."

      - name: Assert test floors
        if: always()
        run: |
          python3 package/.github/scripts/assert_test_floors.py artifacts \
            'Cuvara.DOTS.Tests.Editor>=100' \
            'Cuvara.DOTS.Tests.Runtime>=29' \
            'Cuvara.DOTS.Tests.GameLogic>=41' \
            'Cuvara.DOTS.Tests.Netcode==0' \
            'Cuvara.DOTS.Tests.Prediction==0' \
            'Cuvara.DOTS.Tests.Physics==0' \
            'Cuvara.DOTS.Tests.DI==0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-without-netcode
          path: artifacts/

  # ---------------------------------------------------------------------------
  # Configuration 2: netcode installed.
  #
  # Written before v0.4.0 was tagged, and deliberately left red rather than
  # trimmed to make the run green — a gate shaped to pass is the thing this whole
  # file argues against. The tag landed mid-run; the first attempt failed with
  # "Could not clone ... make sure [v0.4.0] is a valid branch name, tag or full
  # commit hash", which is the row doing its job.
  # ---------------------------------------------------------------------------
  test-with-netcode:
    name: Unity Tests (netcode present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      # THIS MANIFEST SUPPLIES NOTHING ON NETCODE'S BEHALF, DELIBERATELY.
      #
      # An earlier revision added jp.hadashikick.vcontainer and
      # org.nuget.system.runtime.compilerservices.unsafe here to get this job
      # green. That was wrong: a gate that supplies what the package under test
      # failed to declare is not a gate, and it would have recreated exactly the
      # accident that hid these defects — the real Unity project satisfies both by
      # coincidence, which is why neither was visible in the Editor.
      #
      # What stays is `scopedRegistries`, and the distinction is not a loophole:
      #
      #   * DECLARING a dependency is the package's job, and netcode 0.4.1 now
      #     declares jp.hadashikick.vcontainer. This job does not.
      #   * CONFIGURING a registry is the CONSUMER's job and cannot be done by a
      #     package at all — package.json has no scopedRegistries. Every real
      #     consumer of netcode must add OpenUPM themselves; netcode has always
      #     declared com.cysharp.unitask from there.
      #
      # So this job answers the open question honestly: with OpenUPM configured
      # and nothing hand-fed, does netcode 0.4.1 resolve, compile and load? The
      # prediction on writing this was that VContainer would resolve and that
      # Google.Protobuf would still fail to load. Half right: VContainer resolved
      # from netcode's own declaration, and Google.Protobuf loaded too, because
      # 0.4.1 set `validateReferences: 0` on its plugin meta rather than declaring
      # the missing assembly. That is Unity's documented remedy and it loads, but
      # it defers the risk to runtime instead of removing it — nothing here
      # exercises a Protobuf path, so nothing here covers it.
      # If this row fails, the failure IS the finding — do not feed it.
      - name: Bootstrap test project
        run: |
          mkdir -p Assets ProjectSettings Packages

          cat > Packages/manifest.json << 'JSON'
          {
            "dependencies": {
              "com.cuvara.dots": "file:../package",
              "com.cuvara.netcode": "https://github.com/Cuvara/Netcode.git#v0.31.0",
              "com.unity.entities": "1.4.8",
              "com.unity.burst": "1.8.30",
              "com.unity.collections": "2.6.8",
              "com.unity.mathematics": "1.3.2",
              "com.rpgmmo.shared-gamelogic": "https://github.com/Cuvara/rpg-mmo-server.git?path=/backend/gameserver-dotnet/Shared.GameLogic#sgl-v0.3.0"
            },
            "scopedRegistries": [
              {
                "name": "OpenUPM",
                "url": "https://package.openupm.com",
                "scopes": ["com.cysharp", "jp.hadashikick", "org.nuget"]
              }
            ],
            "testables": ["com.cuvara.dots"]
          }
          JSON

          cat > ProjectSettings/ProjectSettings.asset << 'YAML'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            companyName: Cuvara
            productName: DotsTest
          YAML

      # Samples~ is EXCLUDED from Unity import, so a sample compiles nowhere by default —
      # netcode's DOTS sample is in that state right now: 185 tests green while
      # DOTSNetworkBridge.cs is read and never built. Copying the samples into Assets/ is
      # what gives them a compiler. Their own defineConstraints still decide whether each
      # one builds, which is why the assertions below differ per configuration.
      - name: Import samples so they are compiled
        run: |
          # Copy each sample individually. StressBenchmark is excluded because it
          # defines an inline IViewAssetProvider implementation whose asmdef reference
          # to Cuvara.DOTS.Runtime does not resolve when samples are bare-copied into
          # Assets/ in the CI test project (the assembly resolves in a real project
          # where the package is installed via Package Manager, not copied).
          for sample in package/Samples~/*/; do
            name=$(basename "$sample")
            if [ "$name" = "StressBenchmark" ]; then continue; fi
            cp -r "$sample" "Assets/$name"
          done

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.9f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Results (netcode present)
          artifactsPath: artifacts

      # Absent is a fact, not a gap: every package assembly is listed as present or absent,
      # against this row's expectation, in the log, the step summary and the artifact.
      - name: Inventory compiled assemblies
        if: always()
        run: |
          mkdir -p artifacts
          python3 package/.github/scripts/inventory_assemblies.py Library/ScriptAssemblies artifacts/assemblies.md \
            Cuvara.DOTS.Runtime=present Cuvara.DOTS.GameLogic=present Cuvara.DOTS.Netcode=present Cuvara.DOTS.Netcode.Prediction=present Cuvara.DOTS.Physics=absent Cuvara.DOTS.GameFoundation=absent Cuvara.DOTS.Tests.Editor=present Cuvara.DOTS.Tests.Runtime=present Cuvara.DOTS.Tests.GameLogic=present Cuvara.DOTS.Tests.Netcode=present Cuvara.DOTS.Tests.Prediction=present Cuvara.DOTS.Tests.Physics=absent

      - name: Samples must compile
        if: always()
        run: |
          for DLL in Cuvara.DOTS.Samples.HybridViews Cuvara.DOTS.Samples.NetworkedPrediction; do
            test -f "Library/ScriptAssemblies/$DLL.dll" \
              || { echo "::error::$DLL.dll did not compile. A sample nothing compiles is a sample that rots."; exit 1; }
            echo "$DLL.dll built."
          done

      - name: Adapter assembly must be present
        if: always()
        run: |
          if [ ! -f Library/ScriptAssemblies/Cuvara.DOTS.Netcode.dll ]; then
            # OBSERVATION, then candidates. An earlier version of this message
            # asserted one cause ("the versionDefines expression is wrong") and
            # was wrong: netcode had failed to compile, so there was no assembly
            # to reference regardless of any expression. A confident wrong error
            # message costs more than a vague one, because it aims the reader at
            # the wrong package.
            echo "::error::OBSERVED: Cuvara.DOTS.Netcode.dll is absent with com.cuvara.netcode installed. At least four causes produce this, in the order worth checking: (1) com.cuvara.netcode failed to RESOLVE — grep the log for 'cannot be found' / 'Could not clone'; (2) it resolved but failed to COMPILE — grep for 'error CS'; (3) it compiled but failed to LOAD — grep for 'will not be loaded due to errors', which cascades down every dependent assembly; (4) only if none of those, the versionDefines expression in Cuvara.DOTS.Netcode.asmdef did not fire."
            exit 1
          fi
          echo "Cuvara.DOTS.Netcode.dll present."

      # The floor that matters most: 44 adapter tests, not ">= 0". Without it a
      # mis-typed versionDefines expression compiles the adapter and all its
      # tests out of existence and this job goes green over nothing.
      - name: Assert test floors
        if: always()
        run: |
          python3 package/.github/scripts/assert_test_floors.py artifacts \
            'Cuvara.DOTS.Tests.Editor>=100' \
            'Cuvara.DOTS.Tests.Runtime>=29' \
            'Cuvara.DOTS.Tests.GameLogic>=41' \
            'Cuvara.DOTS.Tests.Netcode>=47' \
            'Cuvara.DOTS.Tests.Prediction>=19' \
            'Cuvara.DOTS.Tests.Physics==0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-with-netcode
          path: artifacts/

  # ---------------------------------------------------------------------------
  # Configuration 3: neither optional package.
  #
  # Until this row existed, EVERY job installed com.rpgmmo.shared-gamelogic, so the
  # absent path of CUVARA_SHARED_GAMELOGIC had never once been taken — the gate was
  # asserted, never proven, which is the shape of a gate that quietly never fires.
  #
  # It is also the only row that proves the two-define assembly is gated on BOTH
  # defines rather than just on netcode: Cuvara.DOTS.Netcode.Prediction must be
  # absent here even though it would also be absent for the simpler reason. A row
  # that can only fail one way is worth less than one that can fail two.
  # ---------------------------------------------------------------------------
  test-core-only:
    name: Unity Tests (no optional packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Bootstrap test project
        run: |
          mkdir -p Assets ProjectSettings Packages

          cat > Packages/manifest.json << 'JSON'
          {
            "dependencies": {
              "com.cuvara.dots": "file:../package",
              "com.unity.entities": "1.4.8",
              "com.unity.burst": "1.8.30",
              "com.unity.collections": "2.6.8",
              "com.unity.mathematics": "1.3.2"
            },
            "testables": ["com.cuvara.dots"]
          }
          JSON

          cat > ProjectSettings/ProjectSettings.asset << 'YAML'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            companyName: Cuvara
            productName: DotsTest
          YAML

      # Samples~ is EXCLUDED from Unity import, so a sample compiles nowhere by default —
      # netcode's DOTS sample is in that state right now: 185 tests green while
      # DOTSNetworkBridge.cs is read and never built. Copying the samples into Assets/ is
      # what gives them a compiler. Their own defineConstraints still decide whether each
      # one builds, which is why the assertions below differ per configuration.
      - name: Import samples so they are compiled
        run: |
          # Copy each sample individually. StressBenchmark is excluded because it
          # defines an inline IViewAssetProvider implementation whose asmdef reference
          # to Cuvara.DOTS.Runtime does not resolve when samples are bare-copied into
          # Assets/ in the CI test project (the assembly resolves in a real project
          # where the package is installed via Package Manager, not copied).
          for sample in package/Samples~/*/; do
            name=$(basename "$sample")
            if [ "$name" = "StressBenchmark" ]; then continue; fi
            cp -r "$sample" "Assets/$name"
          done

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.9f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Results (no optional packages)
          artifactsPath: artifacts

      # Absent is a fact, not a gap: every package assembly is listed as present or absent,
      # against this row's expectation, in the log, the step summary and the artifact.
      - name: Inventory compiled assemblies
        if: always()
        run: |
          mkdir -p artifacts
          python3 package/.github/scripts/inventory_assemblies.py Library/ScriptAssemblies artifacts/assemblies.md \
            Cuvara.DOTS.Runtime=present Cuvara.DOTS.Editor=present Cuvara.DOTS.GameLogic=absent Cuvara.DOTS.Netcode=absent Cuvara.DOTS.Netcode.Prediction=absent Cuvara.DOTS.Physics=absent Cuvara.DOTS.DI=absent Cuvara.DOTS.GameFoundation=absent Cuvara.DOTS.Tests.Editor=present Cuvara.DOTS.Tests.Runtime=present Cuvara.DOTS.Tests.GameLogic=absent Cuvara.DOTS.Tests.Netcode=absent Cuvara.DOTS.Tests.Prediction=absent Cuvara.DOTS.Tests.Physics=absent Cuvara.DOTS.Tests.DI=absent

      - name: Samples must compile as their constraints allow
        if: always()
        run: |
          test -f Library/ScriptAssemblies/Cuvara.DOTS.Samples.HybridViews.dll \
            || { echo "::error::HybridViews sample did not compile; it needs no optional package and must always build"; exit 1; }
          test ! -f Library/ScriptAssemblies/Cuvara.DOTS.Samples.NetworkedPrediction.dll \
            || { echo "::error::NetworkedPrediction sample compiled without its optional packages; its defineConstraints are not gating it"; exit 1; }
          echo "HybridViews built; NetworkedPrediction correctly absent."

      - name: Every optional assembly must be absent
        if: always()
        run: |
          FAILED=0
          for DLL in Cuvara.DOTS.Netcode Cuvara.DOTS.Netcode.Prediction Cuvara.DOTS.GameLogic Cuvara.DOTS.Physics Cuvara.DOTS.DI Cuvara.DOTS.GameFoundation; do
            if [ -f "Library/ScriptAssemblies/$DLL.dll" ]; then
              echo "::error::$DLL.dll EXISTS with no optional package installed. Its defineConstraints are not gating it."
              FAILED=1
            else
              echo "$DLL.dll correctly absent."
            fi
          done
          exit $FAILED

      - name: Assert test floors
        if: always()
        run: |
          python3 package/.github/scripts/assert_test_floors.py artifacts \
            'Cuvara.DOTS.Tests.Editor>=100' \
            'Cuvara.DOTS.Tests.Runtime>=29' \
            'Cuvara.DOTS.Tests.GameLogic==0' \
            'Cuvara.DOTS.Tests.Netcode==0' \
            'Cuvara.DOTS.Tests.Prediction==0' \
            'Cuvara.DOTS.Tests.Physics==0' \
            'Cuvara.DOTS.Tests.DI==0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-core-only
          path: artifacts/

  # ---------------------------------------------------------------------------
  # Configuration 4: com.unity.physics present, nothing else optional.
  #
  # Runtime.Physics shipped for three releases with no CI row installing the one
  # package it is gated on, so "compiles in the client" was its entire evidence.
  # Tests/Editor.Physics carries the same versionDefines gate as the assembly it
  # tests, which is exactly why it needs a row where the gate is SATISFIED: in every
  # other row it is compiled out, correctly, and the floor `==0` there proves the
  # gate; the floor `>=35` here proves the tests exist and run. Pinned to the
  # version the client project uses.
  # ---------------------------------------------------------------------------
  test-with-physics:
    name: Unity Tests (physics present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Bootstrap test project
        run: |
          mkdir -p Assets ProjectSettings Packages

          cat > Packages/manifest.json << 'JSON'
          {
            "dependencies": {
              "com.cuvara.dots": "file:../package",
              "com.unity.entities": "1.4.8",
              "com.unity.burst": "1.8.30",
              "com.unity.collections": "2.6.8",
              "com.unity.mathematics": "1.3.2",
              "com.unity.physics": "1.4.7"
            },
            "testables": ["com.cuvara.dots"]
          }
          JSON

          cat > ProjectSettings/ProjectSettings.asset << 'YAML'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            companyName: Cuvara
            productName: DotsTest
          YAML

      - name: Import samples so they are compiled
        run: |
          for sample in package/Samples~/*/; do
            name=$(basename "$sample")
            if [ "$name" = "StressBenchmark" ]; then continue; fi
            cp -r "$sample" "Assets/$name"
          done

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.9f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Results (physics present)
          artifactsPath: artifacts

      # Absent is a fact, not a gap: every package assembly is listed as present or absent,
      # against this row's expectation, in the log, the step summary and the artifact.
      - name: Inventory compiled assemblies
        if: always()
        run: |
          mkdir -p artifacts
          python3 package/.github/scripts/inventory_assemblies.py Library/ScriptAssemblies artifacts/assemblies.md \
            Cuvara.DOTS.Runtime=present Cuvara.DOTS.Physics=present Cuvara.DOTS.Tests.Physics=present Cuvara.DOTS.Netcode=absent Cuvara.DOTS.Netcode.Prediction=absent Cuvara.DOTS.GameLogic=absent Cuvara.DOTS.DI=absent Cuvara.DOTS.GameFoundation=absent Cuvara.DOTS.Tests.Editor=present Cuvara.DOTS.Tests.Runtime=present Cuvara.DOTS.Tests.Netcode=absent Cuvara.DOTS.Tests.Prediction=absent Cuvara.DOTS.Tests.GameLogic=absent Cuvara.DOTS.Tests.DI=absent

      - name: Samples must compile as their constraints allow
        if: always()
        run: |
          test -f Library/ScriptAssemblies/Cuvara.DOTS.Samples.HybridViews.dll \
            || { echo "::error::HybridViews sample did not compile; it needs no optional package and must always build"; exit 1; }
          test ! -f Library/ScriptAssemblies/Cuvara.DOTS.Samples.NetworkedPrediction.dll \
            || { echo "::error::NetworkedPrediction sample compiled without its optional packages; its defineConstraints are not gating it"; exit 1; }

      - name: Assert test floors
        if: always()
        run: |
          python3 package/.github/scripts/assert_test_floors.py artifacts \
            'Cuvara.DOTS.Tests.Editor>=100' \
            'Cuvara.DOTS.Tests.Runtime>=29' \
            'Cuvara.DOTS.Tests.Physics>=35' \
            'Cuvara.DOTS.Tests.GameLogic==0' \
            'Cuvara.DOTS.Tests.Netcode==0' \
            'Cuvara.DOTS.Tests.Prediction==0' \
            'Cuvara.DOTS.Tests.DI==0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-with-physics
          path: artifacts/

  # ---------------------------------------------------------------------------
  # Configuration 5: the client's full stack — netcode, shared-gamelogic, VContainer,
  # MessagePipe (+ its VContainer bridge), UniTask.
  #
  # This is the only row in which Cuvara.DOTS.DI has every assembly it references,
  # and therefore the only row whose floor on Cuvara.DOTS.Tests.DI can be `>=`. The
  # "netcode present" row happens to resolve VContainer through netcode's own
  # declaration and so may compile DI without MessagePipe; that is OBSERVED there
  # by the inventory, never asserted, because a gate should not depend on a
  # dependency's dependency. Pins mirror the client project's packages-lock.json;
  # they are part of the configuration under test and move together.
  # ---------------------------------------------------------------------------
  test-full-stack:
    name: Unity Tests (full stack — netcode, VContainer, MessagePipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Bootstrap test project
        run: |
          mkdir -p Assets ProjectSettings Packages

          cat > Packages/manifest.json << 'JSON'
          {
            "dependencies": {
              "com.cuvara.dots": "file:../package",
              "com.cuvara.netcode": "https://github.com/Cuvara/Netcode.git#v0.31.0",
              "com.unity.entities": "1.4.8",
              "com.unity.burst": "1.8.30",
              "com.unity.collections": "2.6.8",
              "com.unity.mathematics": "1.3.2",
              "com.rpgmmo.shared-gamelogic": "https://github.com/Cuvara/rpg-mmo-server.git?path=/backend/gameserver-dotnet/Shared.GameLogic#sgl-v0.3.0",
              "jp.hadashikick.vcontainer": "1.16.9",
              "com.cysharp.unitask": "2.5.10",
              "com.cysharp.messagepipe": "1.8.1",
              "com.cysharp.messagepipe.vcontainer": "1.8.1"
            },
            "scopedRegistries": [
              {
                "name": "OpenUPM",
                "url": "https://package.openupm.com",
                "scopes": ["com.cysharp", "jp.hadashikick", "org.nuget"]
              }
            ],
            "testables": ["com.cuvara.dots"]
          }
          JSON

          cat > ProjectSettings/ProjectSettings.asset << 'YAML'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            companyName: Cuvara
            productName: DotsTest
          YAML

      - name: Import samples so they are compiled
        run: |
          for sample in package/Samples~/*/; do
            name=$(basename "$sample")
            if [ "$name" = "StressBenchmark" ]; then continue; fi
            cp -r "$sample" "Assets/$name"
          done

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.9f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Results (full stack)
          artifactsPath: artifacts

      # Absent is a fact, not a gap: every package assembly is listed as present or absent,
      # against this row's expectation, in the log, the step summary and the artifact.
      - name: Inventory compiled assemblies
        if: always()
        run: |
          mkdir -p artifacts
          python3 package/.github/scripts/inventory_assemblies.py Library/ScriptAssemblies artifacts/assemblies.md \
            Cuvara.DOTS.Runtime=present Cuvara.DOTS.Netcode=present Cuvara.DOTS.Netcode.Prediction=present Cuvara.DOTS.GameLogic=present Cuvara.DOTS.DI=present Cuvara.DOTS.Physics=absent Cuvara.DOTS.GameFoundation=absent Cuvara.DOTS.Tests.Editor=present Cuvara.DOTS.Tests.Runtime=present Cuvara.DOTS.Tests.GameLogic=present Cuvara.DOTS.Tests.Netcode=present Cuvara.DOTS.Tests.Prediction=present Cuvara.DOTS.Tests.DI=present Cuvara.DOTS.Tests.Physics=absent

      - name: Samples must compile
        if: always()
        run: |
          for DLL in Cuvara.DOTS.Samples.HybridViews Cuvara.DOTS.Samples.NetworkedPrediction; do
            test -f "Library/ScriptAssemblies/$DLL.dll" \
              || { echo "::error::$DLL.dll did not compile."; exit 1; }
          done

      - name: Assert test floors
        if: always()
        run: |
          python3 package/.github/scripts/assert_test_floors.py artifacts \
            'Cuvara.DOTS.Tests.Editor>=100' \
            'Cuvara.DOTS.Tests.Runtime>=29' \
            'Cuvara.DOTS.Tests.GameLogic>=41' \
            'Cuvara.DOTS.Tests.Netcode>=47' \
            'Cuvara.DOTS.Tests.Prediction>=19' \
            'Cuvara.DOTS.Tests.DI>=5' \
            'Cuvara.DOTS.Tests.Physics==0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-full-stack
          path: artifacts/

  # ---------------------------------------------------------------------------
  # Configuration 6: UniT (GameFoundation) present — pooling, resource management,
